<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ui:#08213b;--ub:#f3f8ff;--uc:#ffffff;--ut:#0a1e33;--ul:#d5e3f1}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ub:#071321;--uc:#0d2035;--ut:#eaf6ff;--ul:#24415c;--ui:#22d3ee}}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--ub);color:var(--ut)}
button,input,textarea,select{font:inherit}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--ul);background:var(--uc)}
.logo{font-weight:800;letter-spacing:-.02em}.logo b{background:var(--ui);color:var(--ub);padding:2px 8px;margin-right:6px;border-radius:3px}
.pick{max-width:1000px;margin:0 auto;padding:36px 20px}.pick h1{font-size:clamp(26px,5vw,40px);margin:0 0 6px;letter-spacing:-.03em}.pick p{opacity:.65;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tc{border:1px solid var(--ul);background:var(--uc);padding:10px;cursor:pointer;text-align:left;color:var(--ut);border-radius:6px;transition:transform .2s}.tc:hover{transform:translateY(-4px)}
.tc .sw{height:130px;border-radius:4px;margin-bottom:10px}.tc h3{margin:0;font-size:15px}.tc small{opacity:.6}
.badge{font-size:10px;font-weight:700;background:var(--ui);color:var(--ub);padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.wrap{display:grid;grid-template-columns:340px 1fr;gap:0;min-height:calc(100vh - 56px)}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.ed{position:static!important;max-height:none!important}}
.ed{position:sticky;top:0;max-height:100vh;overflow:auto;padding:16px;border-right:1px solid var(--ul);background:var(--uc)}
.ed h4{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.55}
.ed label{display:block;font-size:12px;margin:8px 0 3px;opacity:.75}
.ed input,.ed textarea,.ed select{width:100%;padding:8px 10px;border:1px solid var(--ul);background:var(--ub);color:var(--ut);border-radius:4px}
.ed textarea{min-height:80px;resize:vertical}.row{display:flex;gap:8px}.row>*{flex:1}
.b{padding:9px 14px;border:1px solid var(--ui);background:var(--ui);color:var(--ub);cursor:pointer;border-radius:4px;font-weight:600}
.b.o{background:none;color:var(--ut);border-color:var(--ul)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:5px 9px;border:1px solid var(--ul);cursor:pointer;font-size:12px;border-radius:3px;background:var(--ub);color:var(--ut)}.chip.on{background:var(--ui);color:var(--ub)}
.stage{padding:24px 12px;overflow:hidden}
/* ===== MEDIA KIT ===== */
.kit{max-width:760px;margin:0 auto;border-radius:10px;overflow:hidden;position:relative;font-family:var(--f);color:var(--tx);background:var(--bg);isolation:isolate}
.kit *{box-sizing:border-box}
.kit .cover{height:220px;background:var(--cv) center/cover}
.kit .pad{padding:0 22px 28px}
.kit .card{background:var(--cd);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:var(--r);padding:22px;margin-top:18px;backdrop-filter:var(--bf);-webkit-backdrop-filter:var(--bf)}
.kit h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 14px;opacity:.6}
.kit .hero{margin-top:-70px;position:relative;text-align:center}
.kit .av{width:116px;height:116px;margin:0 auto 12px;border:3px solid var(--bd);box-shadow:var(--sh);background:var(--cd);display:grid;place-items:center;font-size:40px;font-weight:800;border-radius:var(--r);overflow:hidden}
.kit .av img{width:100%;height:100%;object-fit:cover}
.kit h1{margin:0;font-size:30px;letter-spacing:-.02em}.kit .un{opacity:.6;margin:2px 0 6px}.kit .ti{font-weight:600}
.kit .tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.kit .tag{padding:6px 12px;border:1px solid var(--bd);background:var(--cd);font-size:13px;border-radius:var(--r2)}
.kit .open{background:var(--bt);color:var(--bx);border-color:var(--bt)}.kit .open:before{content:"";display:inline-block;width:8px;height:8px;background:#3ddc84;border-radius:50%;margin-right:7px}
.kit .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kit .st{border:1px solid var(--bd);padding:14px 8px;text-align:center;background:var(--in);border-radius:var(--r2)}
.kit .st b{display:block;font-size:24px}.kit .st>span{font-size:12px;opacity:.65}
.kit .bar{height:12px;background:var(--in);border:1px solid var(--bd);display:flex;overflow:hidden;border-radius:var(--r2)}
.kit .bar i{display:block;height:100%}
.kit .leg{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
.kit .big{font-size:42px;font-weight:800;letter-spacing:-.03em}
.kit .btn{display:inline-block;margin-top:14px;padding:14px 26px;background:var(--bt);color:var(--bx);border:1px solid var(--bb);box-shadow:var(--bs);font-weight:700;cursor:pointer;border-radius:var(--rb);font-size:16px}
.kit .mq{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.kit .tr{display:flex;gap:14px;width:max-content;animation:mq var(--d,24s) linear infinite}
.kit .lg{width:120px;height:68px;border:1px solid var(--bd);background:var(--in);display:grid;place-items:center;flex:none;border-radius:var(--r2);font-weight:700;opacity:.9}
.kit .lg img{max-width:84%;max-height:70%;object-fit:contain}
@keyframes mq{to{transform:translateX(calc(-50% - 7px))}}
.kit .cta,.kit .foot{text-align:center}.kit .foot{font-size:13px;opacity:.75;padding-top:22px}
/* ---- Basic glass ---- */
.t-basic{--f:Inter,system-ui,sans-serif;--r:4px;--r2:3px;--rb:3px;--bf:none;--bd:rgba(255,255,255,.95);--tx:#111;--bg:linear-gradient(145deg,#e4e7ec,#f6f7f9);--cd:linear-gradient(160deg,#fff,#f1f2f5);--in:#f4f5f7;--bt:#0a0a0a;--bx:#fff;--bb:#444;--cv:linear-gradient(135deg,#cfd4dc,#aab1bd);--sh:0 0 0 1px #c8ccd4,0 1px 0 #fff inset,0 -2px 0 rgba(0,0,0,.06) inset,0 14px 28px -10px rgba(0,0,0,.25);--bs:0 1px 0 #555 inset,0 -3px 0 #000 inset,0 8px 16px rgba(0,0,0,.3)}
.t-basic.dk{--bd:rgba(255,255,255,.14);--tx:#f4f4f4;--bg:#070708;--cd:linear-gradient(160deg,#1b1b1e,#0f0f11);--in:#0b0b0d;--bt:#fff;--bx:#000;--bb:#ddd;--cv:linear-gradient(135deg,#2a2a30,#0e0e10);--sh:0 0 0 1px #000,0 1px 0 rgba(255,255,255,.12) inset,0 -2px 0 rgba(0,0,0,.6) inset,0 14px 28px -10px #000;--bs:0 1px 0 #fff inset,0 -3px 0 #bbb inset,0 8px 16px rgba(0,0,0,.6)}
/* ---- Liquid glass ---- */
.t-liquid{--f:Inter,system-ui,sans-serif;--r:6px;--r2:4px;--rb:4px;--bf:blur(22px) saturate(1.8);--bd:rgba(255,255,255,.55);--tx:#fff;--bg:radial-gradient(circle at 15% 10%,#ff5fa2 0,transparent 40%),radial-gradient(circle at 85% 30%,#3d7bff 0,transparent 45%),radial-gradient(circle at 30% 85%,#18e3c0 0,transparent 45%),#14122b;--cd:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.06));--in:rgba(255,255,255,.1);--bt:rgba(0,0,0,.78);--bx:#fff;--bb:rgba(255,255,255,.6);--cv:linear-gradient(120deg,#ff5fa2,#6a5cff 55%,#18e3c0);--sh:0 1px 0 rgba(255,255,255,.9) inset,0 -1px 0 rgba(255,255,255,.2) inset,0 0 0 1px rgba(255,255,255,.12),0 22px 40px -12px rgba(0,0,0,.5)}
.t-liquid{--bs:0 1px 0 rgba(255,255,255,.55) inset,0 -6px 14px rgba(255,255,255,.12) inset,0 12px 24px rgba(0,0,0,.45)}
.t-liquid .card,.t-liquid .btn{position:relative}.t-liquid .card:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.35),transparent 35%);pointer-events:none;border-radius:inherit}
/* ---- Clay ---- */
.t-clay{--f:"Trebuchet MS",system-ui,sans-serif;--r:28px;--r2:16px;--rb:999px;--bf:none;--bd:transparent;--tx:#4a3550;--bg:#fde7ef;--cd:#ffd1e3;--in:#ffe9f1;--bt:#7a5cff;--bx:#fff;--bb:transparent;--cv:linear-gradient(135deg,#ffb3d1,#c8b6ff);--sh:12px 14px 26px rgba(176,110,150,.35),-8px -8px 18px rgba(255,255,255,.9),inset -6px -6px 12px rgba(190,110,150,.2),inset 6px 6px 12px rgba(255,255,255,.7);--bs:8px 10px 18px rgba(80,50,180,.4),inset -4px -5px 9px rgba(40,10,120,.35),inset 4px 5px 9px rgba(255,255,255,.4)}
/* ---- Minimal 3D block ---- */
.t-mini{--f:"Helvetica Neue",Arial,sans-serif;--r:0;--r2:0;--rb:0;--bf:none;--bd:#111;--tx:#111;--bg:#f2efe8;--cd:#fff;--in:#f2efe8;--bt:#111;--bx:#fff;--bb:#111;--cv:linear-gradient(135deg,#ffcf3d,#ff7a3d);--sh:6px 6px 0 #111,12px 12px 0 rgba(17,17,17,.15);--bs:5px 5px 0 #ffcf3d,5px 5px 0 1px #111}
/* ---- Premium animation ---- */
.anim .rv{opacity:0;transform:translateY(34px) scale(.97);filter:blur(6px);transition:opacity .9s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1),filter .9s}
.anim .rv.in{opacity:1;transform:none;filter:none}
.anim .card{transition:transform .5s cubic-bezier(.22,1,.36,1)}.anim .card:hover{transform:translateY(-5px) rotateX(2deg)}
.anim .btn{transition:transform .25s}.anim .btn:hover{transform:translateY(-3px) scale(1.03)}.anim .btn:active{transform:scale(.97)}
.anim .cover{animation:pan 14s ease-in-out infinite alternate}@keyframes pan{to{background-position:60% 40%}}
@media(prefers-reduced-motion:reduce){.anim .rv{transition:none;opacity:1;transform:none;filter:none}.anim .cover{animation:none}}

/* ===== v2 CRAFT LAYER ===== */
.kit h2{font-size:21px;letter-spacing:-.02em;text-transform:none;opacity:1;display:flex;align-items:center;gap:10px}
.kit h2:before{content:"";width:9px;height:9px;background:var(--ac,currentColor);border-radius:var(--r2);flex:none}
.kit .cover{position:relative}.kit .cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,var(--fade,transparent))}
.kit h1{font-size:clamp(30px,6vw,44px);line-height:1;letter-spacing:-.04em;font-weight:800}
.kit .st b{font-size:28px;letter-spacing:-.03em}.kit .card{margin-top:20px;padding:26px;position:relative}
.kit .big{letter-spacing:-.05em}.kit .tag{font-weight:600}
/* BASIC: brushed glass slab */
.t-basic{--f:Manrope,Inter,system-ui,sans-serif;--ac:#0a0a0a;--fade:#e9ebef}
.t-basic.dk{--ac:#fff;--fade:#070708}
.t-basic .cover{background:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 22px),repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,transparent 1px 22px),var(--cv)}
.t-basic .card:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.7) 0,rgba(255,255,255,0) 28%),linear-gradient(0deg,rgba(0,0,0,.04),transparent 20%);border-radius:inherit}
.t-basic.dk .card:after{background:linear-gradient(115deg,rgba(255,255,255,.1) 0,transparent 28%)}
.t-basic .av{box-shadow:0 0 0 6px rgba(255,255,255,.55),0 0 0 7px #c8ccd4,0 18px 30px -8px rgba(0,0,0,.4)}
.t-basic.dk .av{box-shadow:0 0 0 6px rgba(255,255,255,.08),0 0 0 7px #000,0 18px 30px -8px #000}
.t-basic .btn{background:linear-gradient(180deg,#3a3a3a,#000 55%);letter-spacing:.01em}
.t-basic.dk .btn{background:linear-gradient(180deg,#fff,#cfcfcf)}
.t-basic .st{box-shadow:inset 0 2px 5px rgba(0,0,0,.08),0 1px 0 #fff}
/* LIQUID: refractive orbs, specular rims */
.t-liquid{--f:Sora,Inter,system-ui,sans-serif;--ac:#fff;--fade:#14122b}
.t-liquid:before,.t-liquid:after{content:"";position:absolute;border-radius:50%;filter:blur(8px);z-index:-1;animation:orb 16s ease-in-out infinite alternate}
.t-liquid:before{width:340px;height:340px;right:-90px;top:420px;background:radial-gradient(circle at 30% 30%,#fff8,#ff5fa2aa 40%,transparent 70%)}
.t-liquid:after{width:420px;height:420px;left:-140px;top:1100px;background:radial-gradient(circle at 30% 30%,#fff7,#18e3c0aa 40%,transparent 70%);animation-delay:-6s}
@keyframes orb{to{transform:translate(-40px,80px) scale(1.15)}}
.t-liquid .cover{background:radial-gradient(circle at 70% 30%,#fff6,transparent 40%),var(--cv)}
.t-liquid .card{box-shadow:var(--sh),0 0 0 1px rgba(255,255,255,.1),inset 0 0 40px rgba(255,255,255,.07)}
.t-liquid .card:after{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);pointer-events:none}
.t-liquid .av{background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.08));border-color:rgba(255,255,255,.8);animation:fl 6s ease-in-out infinite alternate;backdrop-filter:blur(14px)}
@keyframes fl{to{transform:translateY(-8px)}}
.t-liquid .btn{overflow:hidden;position:relative;backdrop-filter:blur(10px)}
.t-liquid .btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shn 3.6s ease-in-out infinite}
@keyframes shn{60%,100%{left:130%}}
.t-liquid .bar i:last-child{background:rgba(255,255,255,.55)!important}
/* CLAY: candy sculpted world */
.t-clay{--f:Fredoka,"Trebuchet MS",system-ui,sans-serif;--ac:#ff6fa5;--fade:#fde7ef;background:radial-gradient(circle at 10% 20%,#ffd1e3 0 80px,transparent 81px),radial-gradient(circle at 92% 38%,#cfe3ff 0 110px,transparent 111px),radial-gradient(circle at 8% 78%,#d6f5d9 0 90px,transparent 91px),#fde7ef}
.t-clay .pad>.card:nth-child(2){background:#ffe1a8}.t-clay .pad>.card:nth-child(3){background:#c9e4ff}.t-clay .pad>.card:nth-child(4){background:#d4f3dc}
.t-clay .pad>.card:nth-child(5){background:#e6d9ff}.t-clay .pad>.card:nth-child(6){background:#ffd1e3}.t-clay .pad>.card:nth-child(7){background:#ffc9b3}
.t-clay .card{--sh:10px 12px 22px rgba(150,100,130,.3),-8px -8px 16px rgba(255,255,255,.9),inset -6px -8px 14px rgba(0,0,0,.07),inset 6px 6px 12px rgba(255,255,255,.75)}
.t-clay .av{border:6px solid #fff;border-radius:50%;box-shadow:8px 10px 20px rgba(150,100,130,.4),inset -6px -6px 12px rgba(0,0,0,.1);background:#ffb3d1;color:#fff}
.t-clay .st,.t-clay .tag,.t-clay .lg,.t-clay .bar{background:rgba(255,255,255,.55);box-shadow:inset 4px 4px 8px rgba(0,0,0,.07),inset -4px -4px 8px rgba(255,255,255,.9);border:0}
.t-clay .open{background:#7a5cff;box-shadow:4px 5px 10px rgba(80,50,180,.4),inset -2px -3px 6px rgba(0,0,0,.25),inset 2px 2px 5px rgba(255,255,255,.4)}
.t-clay .btn{font-weight:700;box-shadow:var(--bs),inset 0 10px 14px rgba(255,255,255,.25)}.t-clay .btn:hover{transform:translateY(-4px) scale(1.05)}
.t-clay .card:hover{transform:translateY(-6px) rotate(-.4deg)}
/* MINI: poster-block constructivism */
.t-mini{--f:"Space Grotesk","Helvetica Neue",Arial,sans-serif;--ac:#ff5a1f;--fade:#f2efe8;background:radial-gradient(#11111122 1.2px,transparent 1.3px) 0 0/18px 18px,#f2efe8}

.t-mini .pad>.card:nth-child(5){--sh:6px 6px 0 #18c98a,12px 12px 0 #111}.t-mini .pad>.card:nth-child(6){--sh:6px 6px 0 #ff5fa2,12px 12px 0 #111}

.t-mini .av{border-width:3px;box-shadow:6px 6px 0 #ff5a1f}.t-mini h1{font-size:clamp(34px,8vw,56px);text-transform:uppercase;letter-spacing:-.05em}

@media(prefers-reduced-motion:reduce){.t-liquid:before,.t-liquid:after,.t-liquid .av,.t-liquid .btn:after{animation:none}}

/* ===== v3 FIXES: colour harmony, contrast, bugs ===== */
.t-basic{--b2:#c3c8d1;--fade:#e4e7ec}.t-basic.dk{--b2:#4a4a52}
.t-liquid{--b2:rgba(255,255,255,.35);--bg:radial-gradient(circle at 12% 8%,#7b5cff 0,transparent 42%),radial-gradient(circle at 88% 28%,#ff4fa3 0,transparent 38%),radial-gradient(circle at 25% 88%,#22d3ee 0,transparent 42%),#0b0a1f;--cd:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05)),rgba(14,12,40,.4);--cv:linear-gradient(120deg,#7b5cff,#ff4fa3 60%,#22d3ee);--fade:#0b0a1f;--bt:rgba(6,6,16,.82)}

.t-clay{--b2:#fff;--bt:#6c4bff;--bg:#fbeaf0;--fade:#fbeaf0;background:radial-gradient(circle at 10% 18%,#ffd9e6 0 70px,transparent 71px),radial-gradient(circle at 94% 40%,#d6e9ff 0 100px,transparent 101px),radial-gradient(circle at 6% 80%,#d7f2e3 0 85px,transparent 86px),#fbeaf0}
.t-clay .pad>.card:nth-child(2){background:#fff0c2}.t-clay .pad>.card:nth-child(3){background:#d6e9ff}.t-clay .pad>.card:nth-child(4){background:#d7f2e3}
.t-clay .pad>.card:nth-child(5){background:#e8defc}.t-clay .pad>.card:nth-child(6){background:#ffd9e6}.t-clay .pad>.card:nth-child(7){background:#ffd9c7}
